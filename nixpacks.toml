[phases.setup]
nixPkgs = ['chromium', 'nss', 'freetype', 'harfbuzz', 'ca-certificates', 'fonts-liberation']

[phases.install]
cmds = ['npm ci']

[start]
cmd = 'node src/server.js'

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = 'true'
# No PUPPETEER_EXECUTABLE_PATH here — nix store paths are hashed, so a literal
# path is always wrong. exporter.js resolves chromium from PATH at runtime.
